name: Penny Agent

on:
  schedule:
    # Every 3 hours. GitHub cron is UTC and can run a few minutes late.
    - cron: "17 */3 * * *"
  workflow_dispatch: {}   # lets you tap "Run workflow" by hand

permissions:
  contents: write

concurrency:
  group: penny-agent
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run agent
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HOME_STATES: ${{ vars.HOME_STATES }}
        run: python penny_agent.py

      - name: Save memory of what was already sent
        run: |
          git config user.name "penny-agent"
          git config user.email "penny-agent@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "update seen items"
          git push
