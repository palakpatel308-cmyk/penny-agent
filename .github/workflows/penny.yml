name: Penny Agent

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: penny-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python penny_agent.py

      - name: Save seen list
        run: |
          if [ -f seen.json ]; then
            git config user.name "penny-agent"
            git config user.email "penny-agent@users.noreply.github.com"
            git add seen.json
            git diff --cached --quiet || git commit -m "Update seen items [skip ci]"
            git push
          fi
